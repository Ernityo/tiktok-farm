name: TrainerApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  TrainerApp:
    type: application
    platform: iOS
    sources: [TrainerApp]
    info:
      path: TrainerApp/Info.plist
      properties:
        CFBundleDisplayName: Swipe Trainer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        PhoneUDID: $(PHONE_UDID)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.swipetrainer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
